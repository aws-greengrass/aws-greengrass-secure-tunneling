name: Release Pipeline

# This workflow is intentionally manual-only and requires an explicit
# localproxy release tag for reproducibility.
on:
  workflow_dispatch:
    inputs:
      localproxy_ref:
        description:
          "Release tag of aws-samples/aws-iot-securetunneling-localproxy to
          build (must be >v3.3.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  LOCALPROXY_REPO: https://github.com/aws-samples/aws-iot-securetunneling-localproxy.git

jobs:
  package:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    env:
      LOCALPROXY_REF: ${{ inputs.localproxy_ref }}

    steps:
      - name: Validate localproxy ref
        run: |
          if [ -z "$LOCALPROXY_REF" ]; then
            echo "ERROR: LOCALPROXY_REF is empty. You must supply a localproxy release tag when triggering this workflow."
            exit 1
          fi
          # Allowlist git-ref-safe characters only. The ref is user-supplied via
          # workflow_dispatch and is interpolated into a shell command, so reject
          # anything that could word-split or inject.
          if ! [[ "$LOCALPROXY_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "ERROR: LOCALPROXY_REF contains invalid characters: $LOCALPROXY_REF"
            exit 1
          fi
          echo "Building with LOCALPROXY_REF=$LOCALPROXY_REF"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set version
        id: version
        run: echo "VERSION=$(cat version)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git curl zip libssl-dev zlib1g-dev

      - name: Build secure-tunnel
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=MinSizeRel
          make -C build -j$(nproc)
          strip build/bin/aws-greengrass-secure-tunnel

      - name: Clone and build localproxy
        run: |
          # Clone outside this repo tree so file(GLOB_RECURSE src/*.c) in
          # CMakeLists.txt never picks up localproxy sources.
          git clone --depth 1 --branch "$LOCALPROXY_REF" "$LOCALPROXY_REPO" "$RUNNER_TEMP/localproxy"
          cd "$RUNNER_TEMP/localproxy"
          mkdir -p build && cd build
          cmake .. -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch
          make -j$(nproc)
          strip bin/localproxy

      - name: Verify binaries
        run: |
          echo "--- secure-tunnel binary ---"
          test -f build/bin/aws-greengrass-secure-tunnel || { echo "ERROR: aws-greengrass-secure-tunnel not found"; exit 1; }
          file build/bin/aws-greengrass-secure-tunnel

          echo "--- localproxy binary ---"
          test -f "$RUNNER_TEMP/localproxy/build/bin/localproxy" || { echo "ERROR: localproxy not found"; exit 1; }
          file "$RUNNER_TEMP/localproxy/build/bin/localproxy"

      - name: Stage bundle contents
        run: |
          mkdir -p staging
          #Stage binaries for zip creation
          cp build/bin/aws-greengrass-secure-tunnel staging/
          cp "$RUNNER_TEMP/localproxy/build/bin/localproxy" staging/

          echo "--- staged binaries ---"
          ls -l staging

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GreengrassV2SecureTunnelingComponent-${{ matrix.arch }}
          path: staging/*
          retention-days: 2
          if-no-files-found: error

  package-armv7l:
    name: Package armv7l
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      LOCALPROXY_REF: ${{ inputs.localproxy_ref }}

    steps:
      - name: Validate localproxy ref
        run: |
          if [ -z "$LOCALPROXY_REF" ]; then
            echo "ERROR: LOCALPROXY_REF is empty. You must supply a localproxy release tag when triggering this workflow."
            exit 1
          fi
          # Allowlist git-ref-safe characters only. The ref is user-supplied via
          # workflow_dispatch and is interpolated into a shell command, so reject
          # anything that could word-split or inject.
          if ! [[ "$LOCALPROXY_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "ERROR: LOCALPROXY_REF contains invalid characters: $LOCALPROXY_REF"
            exit 1
          fi
          echo "Building with LOCALPROXY_REF=$LOCALPROXY_REF"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set version
        id: version
        run: echo "VERSION=$(cat version)" >> $GITHUB_OUTPUT

      - name: Install armhf cross toolchain and multiarch sysroot
        run: |
          sudo dpkg --add-architecture armhf
          # The runner's sources use "deb mirror+file:...", not an http URL, so match any
          # scheme: left unscoped, armhf 404s on the amd64-only mirrors and apt fails.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sudo sed -i -E '/^deb .*arch=/! { s|^deb \[([^]]*)\] (\S+)|deb [arch=amd64 \1] \2|; t; s|^deb (\S+)|deb [arch=amd64] \1|; }' "$f"
          done
          # armhf is served from ports.ubuntu.com, not archive.ubuntu.com.
          sudo tee /etc/apt/sources.list.d/armhf-ports.list >/dev/null <<'PORTS'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
          PORTS
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-armhf cmake pkg-config git curl zip unzip libssl-dev:armhf zlib1g-dev:armhf

      - name: Write armhf multiarch toolchain file
        run: |
          cat > /tmp/armhf-multiarch.cmake <<'TOOLCHAIN'
          set(CMAKE_SYSTEM_NAME      Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)

          set(CMAKE_C_COMPILER   arm-linux-gnueabihf-gcc)
          set(CMAKE_CXX_COMPILER arm-linux-gnueabihf-g++)

          # No CMAKE_SYSROOT: multiarch puts armhf under the host root, and the cross gcc's
          # auto-detected CMAKE_LIBRARY_ARCHITECTURE steers find_package(OpenSSL) to it.

          # BOTH, not ONLY: there is no sysroot tree, so ONLY would hide /usr/include.
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)

          set(ENV{PKG_CONFIG_LIBDIR} /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig)
          TOOLCHAIN

      - name: Build secure-tunnel
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=/tmp/armhf-multiarch.cmake -DCMAKE_BUILD_TYPE=MinSizeRel
          make -C build -j$(nproc)
          arm-linux-gnueabihf-strip build/bin/aws-greengrass-secure-tunnel

      - name: Clone localproxy
        run: |
          # Clone outside this repo tree so file(GLOB_RECURSE src/*.c) in
          # CMakeLists.txt never picks up localproxy sources.
          git clone --depth 1 --branch "$LOCALPROXY_REF" "$LOCALPROXY_REPO" "$RUNNER_TEMP/localproxy"

      # Generated .pb.h carries a PROTOBUF_MIN_PROTOC_VERSION guard, so a mismatched
      # host protoc #errors at compile; pin it to localproxy's fc_deps.json version.
      - name: Install host protoc matching localproxy fc_deps.json
        run: |
          VER=$(jq -r .protobuf.version "$RUNNER_TEMP/localproxy/fc_deps.json")
          echo "Installing host protoc $VER"
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$VER/protoc-$VER-linux-x86_64.zip"
          # unzip drops the execute bit; restore it before the smoke test (else exit 126).
          sudo unzip -o /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      # Cross builds default to system dep mode, so fetch must be explicit; and
      # LOCALPROXY_PROTOC_EXECUTABLE is mandatory when cross-compiling.
      - name: Cross-build localproxy
        run: |
          cd "$RUNNER_TEMP/localproxy"
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/tmp/armhf-multiarch.cmake -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch -DLOCALPROXY_PROTOC_EXECUTABLE=/usr/local/bin/protoc
          make -j$(nproc)
          arm-linux-gnueabihf-strip bin/localproxy

      - name: Verify binaries
        run: |
          echo "--- secure-tunnel binary ---"
          test -f build/bin/aws-greengrass-secure-tunnel || { echo "ERROR: aws-greengrass-secure-tunnel not found"; exit 1; }
          file build/bin/aws-greengrass-secure-tunnel
          file build/bin/aws-greengrass-secure-tunnel | grep -q 'ELF 32-bit LSB.*ARM'

          echo "--- localproxy binary ---"
          test -f "$RUNNER_TEMP/localproxy/build/bin/localproxy" || { echo "ERROR: localproxy not found"; exit 1; }
          file "$RUNNER_TEMP/localproxy/build/bin/localproxy"
          file "$RUNNER_TEMP/localproxy/build/bin/localproxy" | grep -q 'ELF 32-bit LSB.*ARM'

      - name: Stage bundle contents
        run: |
          mkdir -p staging
          #Stage binaries for zip creation
          cp build/bin/aws-greengrass-secure-tunnel staging/
          cp "$RUNNER_TEMP/localproxy/build/bin/localproxy" staging/

          echo "--- staged binaries ---"
          ls -l staging

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GreengrassV2SecureTunnelingComponent-armv7l
          path: staging/*
          retention-days: 2
          if-no-files-found: error
