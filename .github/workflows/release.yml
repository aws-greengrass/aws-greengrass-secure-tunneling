name: Release Pipeline

# This workflow is intentionally manual-only and requires an explicit
# localproxy release tag for reproducibility.
on:
  workflow_dispatch:
    inputs:
      localproxy_ref:
        description:
          "Release tag of aws-samples/aws-iot-securetunneling-localproxy to
          build (e.g. v3.3.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  LOCALPROXY_REPO: https://github.com/aws-samples/aws-iot-securetunneling-localproxy.git

jobs:
  package:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    env:
      LOCALPROXY_REF: ${{ inputs.localproxy_ref }}

    steps:
      - name: Validate localproxy ref
        run: |
          if [ -z "$LOCALPROXY_REF" ]; then
            echo "ERROR: LOCALPROXY_REF is empty. You must supply a localproxy release tag when triggering this workflow."
            exit 1
          fi
          # Allowlist git-ref-safe characters only. The ref is user-supplied via
          # workflow_dispatch and is interpolated into a shell command, so reject
          # anything that could word-split or inject.
          if ! [[ "$LOCALPROXY_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "ERROR: LOCALPROXY_REF contains invalid characters: $LOCALPROXY_REF"
            exit 1
          fi
          echo "Building with LOCALPROXY_REF=$LOCALPROXY_REF"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set version
        id: version
        run: echo "VERSION=$(cat version)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git curl zip libssl-dev zlib1g-dev

      - name: Build secure-tunnel
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=MinSizeRel
          make -C build -j$(nproc)
          strip build/bin/aws-greengrass-secure-tunnel

      - name: Clone and build localproxy
        run: |
          # Clone outside this repo tree so file(GLOB_RECURSE src/*.c) in
          # CMakeLists.txt never picks up localproxy sources.
          git clone --depth 1 --branch "$LOCALPROXY_REF" "$LOCALPROXY_REPO" "$RUNNER_TEMP/localproxy"
          cd "$RUNNER_TEMP/localproxy"
          mkdir -p build && cd build
          cmake .. -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch
          make -j$(nproc)
          strip bin/localproxy

      - name: Verify binaries
        run: |
          echo "--- secure-tunnel binary ---"
          test -f build/bin/aws-greengrass-secure-tunnel || { echo "ERROR: aws-greengrass-secure-tunnel not found"; exit 1; }
          file build/bin/aws-greengrass-secure-tunnel

          echo "--- localproxy binary ---"
          test -f "$RUNNER_TEMP/localproxy/build/bin/localproxy" || { echo "ERROR: localproxy not found"; exit 1; }
          file "$RUNNER_TEMP/localproxy/build/bin/localproxy"

      - name: Stage bundle contents
        run: |
          mkdir -p staging
          #Stage binaries for zip creation
          cp build/bin/aws-greengrass-secure-tunnel staging/
          cp "$RUNNER_TEMP/localproxy/build/bin/localproxy" staging/

          echo "--- staged binaries ---"
          ls -l staging

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name:
            aws.greengrass.securetunneling-${{ matrix.arch }}-${{
            steps.version.outputs.VERSION }}
          path: staging/*
          retention-days: 2
          if-no-files-found: error

  package-armv7l:
    name: Package armv7l
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      LOCALPROXY_REF: ${{ inputs.localproxy_ref }}

    steps:
      - name: Validate localproxy ref
        run: |
          if [ -z "$LOCALPROXY_REF" ]; then
            echo "ERROR: LOCALPROXY_REF is empty. You must supply a localproxy release tag when triggering this workflow."
            exit 1
          fi
          # Allowlist git-ref-safe characters only. The ref is user-supplied via
          # workflow_dispatch and is interpolated into a shell command, so reject
          # anything that could word-split or inject.
          if ! [[ "$LOCALPROXY_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "ERROR: LOCALPROXY_REF contains invalid characters: $LOCALPROXY_REF"
            exit 1
          fi
          echo "Building with LOCALPROXY_REF=$LOCALPROXY_REF"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set version
        id: version
        run: echo "VERSION=$(cat version)" >> $GITHUB_OUTPUT

      - name: Build in container
        run: |
          docker run --rm --platform=linux/arm/v7 \
            -v $PWD:/workspace \
            -w /workspace \
            -e LOCALPROXY_REF \
            -e LOCALPROXY_REPO \
            arm32v7/ubuntu:22.04 \
            bash -c "
              set -e
              apt-get update
              # 'file' is required by the binary verification below and is not in
              # the arm32v7/ubuntu base image. The other architectures run on
              # GitHub-hosted runners, where it is preinstalled.
              apt-get install -y build-essential cmake pkg-config git curl zip libssl-dev zlib1g-dev file
              cmake -B build -DCMAKE_BUILD_TYPE=MinSizeRel
              make -C build -j\$(nproc)
              strip build/bin/aws-greengrass-secure-tunnel
              git clone --depth 1 --branch \"\$LOCALPROXY_REF\" \"\$LOCALPROXY_REPO\" /tmp/localproxy
              cd /tmp/localproxy
              mkdir -p build
              cd build
              cmake .. -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch
              make -j\$(nproc)
              strip bin/localproxy
              echo --- secure-tunnel binary ---
              test -f /workspace/build/bin/aws-greengrass-secure-tunnel || { echo ERROR: aws-greengrass-secure-tunnel not found; exit 1; }
              file /workspace/build/bin/aws-greengrass-secure-tunnel
              echo --- localproxy binary ---
              test -f /tmp/localproxy/build/bin/localproxy || { echo ERROR: localproxy not found; exit 1; }
              file /tmp/localproxy/build/bin/localproxy
              mkdir -p /workspace/staging
              cp /workspace/build/bin/aws-greengrass-secure-tunnel /workspace/staging/
              cp /tmp/localproxy/build/bin/localproxy /workspace/staging/
              echo --- staged binaries ---
              ls -l /workspace/staging
            "

      # The container runs as root and writes build/ and staging/ into the
      # bind-mounted checkout, so hand ownership back to the runner user before
      # upload-artifact reads them.
      - name: Fix file ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name:
            aws.greengrass.securetunneling-armv7l-${{
            steps.version.outputs.VERSION }}
          path: staging/*
          retention-days: 2
          if-no-files-found: error
